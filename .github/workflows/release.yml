name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi

      - name: Signature
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in build/app/outputs/flutter-apk/*-release.apk; do
            echo "== $f"
            "$BT/apksigner" verify --print-certs "$f"
          done

      - name: Rename
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" \
               "CarbideShell_${GITHUB_REF_NAME}_$abi.apk"
            ls -l "CarbideShell_${GITHUB_REF_NAME}_$abi.apk"
          done

      - name: Release notes
        run: python3 tool/release_notes.py "${GITHUB_REF_NAME}" > release_notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: CarbideShell_*.apk
          prerelease: true
          body_path: release_notes.md
