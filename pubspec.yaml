name: carbide_shell
description: An agent that runs on phone and desktop and can operate SSH.
publish_to: 'none'
version: 0.0.32+32

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dartssh2: ^4.1.0
  xterm: ^4.0.0
  url_launcher: ^6.3.0
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/pet/
